<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Simulacion MMU</title>
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <main class="simulation-shell" aria-label="Visualizacion de simulacion MMU">
      <header class="topbar">
        <div>
          <p class="eyebrow">Proyecto 2 - Sistemas Operativos</p>
          <h1>Simulacion de paginacion MMU</h1>
        </div>

                <section class="run-summary" aria-label="Parametros de la simulacion">
          <div class="control-card">
            <label for="seedInput">Semilla</label>
            <input id="seedInput" type="text" placeholder="Generar automaticamente">
          </div>

          <div class="control-card compact-control">
            <label for="processCount">Numero procesos (P)</label>
            <select id="processCount" name="processCount">
              <option value="10">10</option>
              <option value="50">50</option>
              <option value="100">100</option>
            </select>
          </div>

          <div class="control-card compact-control">
            <label for="operationCount">Cantidad Operaciones (N)</label>
            <select id="operationCount" name="operationCount">
              <option value="500">500</option>
              <option value="1000">1000</option>
              <option value="5000">5000</option>
            </select>
          </div>

          <div class="control-card compact-control">
            <label for="algoritmoSelector">Algoritmo</label>
            <select id="algoritmoSelector" name="algoritmo">
              <option value="FIFO">FIFO</option>
              <option value="SC">SC</option>
              <option value="LRU">LRU</option>
              <option value="LFU">LFU</option>
            </select>
          </div>

          <div class="control-card file-control">
            <label for="fileInput">Input Archivo</label>
            <input id="fileInput" type="file" accept=".txt,text/plain">
          </div>

          <div class="control-card action-control">
            <span>Archivo de operaciones</span>
            <div class="button-row">
              <button id="generateBtn" type="button">Generar</button>
              <button id="downloadBtn" type="button">Descargar</button>
            </div>
          </div>

          <div class="control-card action-control">
            <span>Simulacion</span>
            <div class="button-row">
              <button id="playBtn" type="button">Play</button>
              <button id="pauseBtn" type="button">Pause</button>
              <button id="stepBtn" type="button">Step</button>
            </div>
          </div>

          <p id="scenarioStatus" class="scenario-status" aria-live="polite">Preparando escenario...</p>
        </section>
      </header>

      <section class="memory-strip" aria-label="Estado de RAM">
        <article class="ram-row">
          <span class="ram-title">RAM - OPT</span>
          <div id="ram-opt" class="ram-bar" role="img" aria-label="100 paginas de RAM para algoritmo optimo"></div>
            <!--
            <span class="page free"></span><span class="page p1"></span><span class="page p1"></span><span class="page p1"></span><span class="page p2"></span>
            <span class="page p2"></span><span class="page p2"></span><span class="page p3"></span><span class="page p3"></span><span class="page p3"></span>

            <span class="page p6"></span><span class="page p6"></span><span class="page p6"></span><span class="page p4"></span><span class="page p4"></span>

            <span class="page p7"></span><span class="page p3"></span><span class="page p3"></span><span class="page p3"></span><span class="page p5"></span>
            <span class="page p5"></span><span class="page p5"></span><span class="page p2"></span><span class="page p2"></span><span class="page p1"></span>
            <span class="page p1"></span><span class="page free"></span><span class="page free"></span><span class="page free"></span><span class="page free"></span>
            <span class="page free"></span><span class="page free"></span><span class="page free"></span><span class="page free"></span><span class="page free"></span>

            <span class="page free"></span><span class="page free"></span><span class="page free"></span><span class="page free"></span><span class="page free"></span>
            <span class="page free"></span><span class="page free"></span><span class="page free"></span><span class="page free"></span><span class="page free"></span>
            <span class="page free"></span><span class="page free"></span><span class="page free"></span><span class="page free"></span><span class="page free"></span>
            <span class="page free"></span><span class="page free"></span><span class="page free"></span><span class="page free"></span><span class="page free"></span>
            -->
          </div>
        </article>

        <article class="ram-row">
          <span class="ram-title">RAM - ALG</span>
          <div id="ram-alg" class="ram-bar" role="img" aria-label="100 paginas de RAM para algoritmo seleccionado"></div>
            <!--
            <span class="page p1"></span><span class="page p1"></span><span class="page p1"></span><span class="page p1"></span><span class="page p2"></span>
            <span class="page p2"></span><span class="page p2"></span><span class="page p3"></span><span class="page p3"></span><span class="page p3"></span>

            <span class="page p6"></span><span class="page p6"></span><span class="page p7"></span><span class="page p7"></span><span class="page p7"></span>
            <span class="page p7"></span><span class="page p8"></span><span class="page p8"></span><span class="page p8"></span><span class="page p8"></span>
            <span class="page p4"></span><span class="page p4"></span><span class="page p4"></span><span class="page p1"></span><span class="page p1"></span>
            <span class="page p1"></span><span class="page p3"></span><span class="page p3"></span><span class="page p3"></span><span class="page p5"></span>

            <span class="page p4"></span><span class="page p4"></span><span class="page p5"></span><span class="page p5"></span><span class="page p3"></span>
            <span class="page p3"></span><span class="page p1"></span><span class="page p1"></span><span class="page p6"></span><span class="page p6"></span>
            <span class="page p6"></span><span class="page free"></span><span class="page free"></span><span class="page free"></span><span class="page free"></span>
            <span class="page free"></span><span class="page free"></span><span class="page free"></span><span class="page free"></span><span class="page free"></span>
            <span class="page free"></span><span class="page free"></span><span class="page free"></span><span class="page free"></span><span class="page free"></span>
            <span class="page free"></span><span class="page free"></span><span class="page free"></span><span class="page free"></span><span class="page free"></span>
            <span class="page free"></span><span class="page free"></span><span class="page free"></span><span class="page free"></span><span class="page free"></span>
            <span class="page free"></span><span class="page free"></span><span class="page free"></span><span class="page free"></span><span class="page free"></span>
            <span class="page free"></span><span class="page free"></span><span class="page free"></span><span class="page free"></span><span class="page free"></span>
            -->  
          </div>
        </article>
      </section>

      <section class="comparison-grid" aria-label="Comparacion de algoritmos">
        <article class="algorithm-panel">
          <header class="panel-title">MMU - OPT</header>
          <div class="mmu-table-wrap">
            <table class="mmu-table">
              <thead>
                <tr>
                  <th>PAGE ID</th>
                  <th>PID</th>
                  <th>LOADED</th>
                  <th>L-ADDR</th>
                  <th>M-D</th>
                  <th>D-ADDR</th>
                  <th>LOADED-T</th>
                  <th>MARK</th>
                </tr>
              </thead>
              <tbody id="mmu-opt-body"></tbody>
            </table>
          </div>

          <div id="metrics-opt" class="metrics"></div>
        </article>

        <article class="algorithm-panel">
          <header id="selected-panel-title" class="panel-title">MMU - ALG</header>
          <div class="mmu-table-wrap">
            <table class="mmu-table">
              <thead>
                <tr>
                  <th>PAGE ID</th>
                  <th>PID</th>
                  <th>LOADED</th>
                  <th>L-ADDR</th>
                  <th>M-D</th>
                  <th>D-ADDR</th>
                  <th>LOADED-T</th>
                  <th>MARK</th>
                </tr>
              </thead>
              <tbody id="mmu-alg-body"></tbody>
            </table>
          </div>

          <div id="metrics-alg" class="metrics"></div>
        </article>
      </section>
    </main>
  </body>
</html>
