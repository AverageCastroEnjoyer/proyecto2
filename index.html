            <table class="mmu-table">
              <thead>

                  <th>PAGE ID</th>
                  <th>PID</th>
                  <th>LOADED</th>
                  <th>L-ADDR</th>
                  <th>M-D</th>
                  <th>D-ADDR</th>
                  <th>LOADED-T</th>
                  <th>MARK</th>

              </thead>
              <tbody id="mmu-opt-body"></tbody>
            </table>
          </div>
