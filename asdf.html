<script type="module">
    // Importar la función pickVictim
    import { pickVictim } from './algorithm.js';
    
    // Suponiendo que ya tienes tu objeto mmu definido
    const mmu = {
        algorithm: 'FIFO',  // Valor por defecto
        ram: [],            // Array de páginas
        secondChancePointer: 0,
        // tus otras propiedades
    };
    
    // Conectar con el dropdown
    const select = document.getElementById('algoritmoSelector');
    
    // Opción A: Actualizar mmu.algorithm cuando cambia el select
    select.addEventListener('change', (e) => {
        mmu.algorithm = e.target.value;
        console.log(`Algoritmo cambiado a: ${mmu.algorithm}`);
        
        // Opcional: Si quieres ejecutar pickVictim inmediatamente
        // const resultado = pickVictim(mmu, currentOperationIndex);
    });
    
    // Opción B: Usar un getter para que mmu.algorithm siempre refleje el dropdown
    // Object.defineProperty(mmu, 'algorithm', {
    //     get: () => document.getElementById('algoritmoSelector').value
    // });
    
    // Establecer valor inicial
    mmu.algorithm = select.value;
    
    // Ahora cada vez que necesites seleccionar una víctima:
    function cuandoNecesitesVictima(operationIndex) {
        const victimaIndex = pickVictim(mmu, operationIndex);
        // Usar victimaIndex para reemplazar la página
        return victimaIndex;
    }
    
    // Exponer globalmente si es necesario
    window.mmu = mmu;
    window.pickVictim = pickVictim;
</script>
